name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: 
    - name: make build folder
      run: mkdir build
    - name: cd into build dir
      run: cd build
    - name: build using cmake
      run: cmake -B build ..
    - name: compiling
      run: make -j(nproc)
